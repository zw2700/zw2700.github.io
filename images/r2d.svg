<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-labelledby="title desc">
  <title id="title">Random Remask-Denoise</title>
  <desc id="desc">Masked tokens are repeatedly remasked and denoised.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf6ff"/>
      <stop offset="1" stop-color="#fff4df"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#56738f"/>
    </marker>
  </defs>
  <rect width="240" height="180" rx="18" fill="url(#background)"/>
  <text x="120" y="40" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="28" font-weight="700" fill="#163b5c">R<tspan baseline-shift="super" font-size="17">2</tspan>D</text>
  <text x="120" y="61" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#56738f">REMASK · DENOISE</text>
  <g transform="translate(28 82)">
    <rect width="34" height="34" rx="7" fill="#1772d0"/>
    <text x="17" y="23" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="white">A</text>
    <rect x="50" width="34" height="34" rx="7" fill="#d8e2ea"/>
    <text x="67" y="23" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#56738f">?</text>
    <rect x="100" width="34" height="34" rx="7" fill="#1772d0"/>
    <text x="117" y="23" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="white">C</text>
    <rect x="150" width="34" height="34" rx="7" fill="#d8e2ea"/>
    <text x="167" y="23" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#56738f">?</text>
  </g>
  <path d="M65 133 C82 157, 158 157, 175 133" fill="none" stroke="#56738f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="120" y="169" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="10" fill="#56738f">ITERATIVE CORRECTION</text>
</svg>
