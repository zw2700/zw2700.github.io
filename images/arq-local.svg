<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">ARQ local learning</title>
  <desc id="desc">State and action merge into a shared input rail before it feeds two layers. Each layer has its own hidden vector, scalar output, and local update loop.</desc>
  <defs>
    <marker id="navy-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#27445f"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2878b5"/>
    </marker>
    <marker id="coral-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#e85d4a"/>
    </marker>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9fd"/>
      <stop offset="1" stop-color="#fff9ec"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="580" height="580" rx="46" fill="url(#panel)"/>

  <!-- State input -->
  <rect x="31" y="30" width="78" height="78" rx="16" fill="#dcecff" stroke="#2878b5" stroke-width="7"/>
  <g fill="#2878b5">
    <rect x="45" y="44" width="14" height="14" rx="3"/>
    <rect x="63" y="44" width="14" height="14" rx="3" opacity=".45"/>
    <rect x="81" y="44" width="14" height="14" rx="3" opacity=".75"/>
    <rect x="45" y="62" width="14" height="14" rx="3" opacity=".45"/>
    <rect x="63" y="62" width="14" height="14" rx="3" opacity=".85"/>
    <rect x="81" y="62" width="14" height="14" rx="3" opacity=".35"/>
    <rect x="45" y="80" width="14" height="14" rx="3" opacity=".65"/>
    <rect x="63" y="80" width="14" height="14" rx="3" opacity=".35"/>
    <rect x="81" y="80" width="14" height="14" rx="3"/>
  </g>
  <path d="M70 108V122H220" fill="none" stroke="#2878b5" stroke-width="9" stroke-linecap="round"/>

  <!-- Action input joins the rail before either layer -->
  <circle cx="177" cy="69" r="39" fill="#fff0ec" stroke="#e85d4a" stroke-width="7"/>
  <path d="M155 69H193M180 54L195 69L180 84" fill="none" stroke="#e85d4a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M216 69H220" fill="none" stroke="#e85d4a" stroke-width="9" stroke-linecap="round"/>

  <!-- Shared state-action rail branches to both layers -->
  <path d="M220 69V427" fill="none" stroke="#27445f" stroke-width="9" stroke-linecap="round"/>
  <path d="M220 185H248" fill="none" stroke="#27445f" stroke-width="9" stroke-linecap="round" marker-end="url(#navy-arrow)"/>
  <circle cx="220" cy="185" r="8" fill="#27445f"/>

  <!-- Local layer one -->
  <rect x="260" y="102" width="218" height="166" rx="28" fill="#fff1c9" stroke="#d7ad4c" stroke-width="7"/>
  <path d="M305 225A43 43 0 1 1 335 158" fill="none" stroke="#e85d4a" stroke-width="9" stroke-linecap="round" marker-end="url(#coral-arrow)"/>
  <path d="M311 183L332 183L319 205L341 205L306 239L317 213L297 213Z" fill="#e85d4a"/>
  <g fill="#3f86c5">
    <rect x="363" y="181" width="16" height="45" rx="5"/>
    <rect x="386" y="156" width="16" height="70" rx="5" opacity=".85"/>
    <rect x="409" y="190" width="16" height="36" rx="5" opacity=".7"/>
    <rect x="432" y="143" width="16" height="83" rx="5" opacity=".95"/>
  </g>
  <path d="M450 185H500" fill="none" stroke="#27445f" stroke-width="7" marker-end="url(#navy-arrow)"/>
  <circle cx="539" cy="185" r="34" fill="#60cfad" stroke="#16755e" stroke-width="7"/>
  <circle cx="539" cy="185" r="10" fill="#104d40"/>

  <!-- Forward activations only -->
  <path d="M369 270V332" fill="none" stroke="#27445f" stroke-width="9" stroke-linecap="round" marker-end="url(#navy-arrow)"/>

  <path d="M220 427H248" fill="none" stroke="#27445f" stroke-width="9" stroke-linecap="round" marker-end="url(#navy-arrow)"/>
  <circle cx="220" cy="427" r="8" fill="#27445f"/>

  <!-- Local layer two -->
  <rect x="260" y="344" width="218" height="166" rx="28" fill="#fff1c9" stroke="#d7ad4c" stroke-width="7"/>
  <path d="M305 467A43 43 0 1 1 335 400" fill="none" stroke="#e85d4a" stroke-width="9" stroke-linecap="round" marker-end="url(#coral-arrow)"/>
  <path d="M311 425L332 425L319 447L341 447L306 481L317 455L297 455Z" fill="#e85d4a"/>
  <g fill="#3f86c5">
    <rect x="363" y="413" width="16" height="55" rx="5" opacity=".8"/>
    <rect x="386" y="398" width="16" height="70" rx="5"/>
    <rect x="409" y="427" width="16" height="41" rx="5" opacity=".65"/>
    <rect x="432" y="408" width="16" height="60" rx="5" opacity=".9"/>
  </g>
  <path d="M450 427H500" fill="none" stroke="#27445f" stroke-width="7" marker-end="url(#navy-arrow)"/>
  <circle cx="539" cy="427" r="34" fill="#60cfad" stroke="#16755e" stroke-width="7"/>
  <circle cx="539" cy="427" r="10" fill="#104d40"/>
</svg>
